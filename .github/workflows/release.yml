name: Release agent binaries

# Triggers when you push a tag like v1.0.0
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14          # Apple Silicon runner
            binary: agent
            asset_name: agent-aarch64-apple-darwin

          - target: x86_64-apple-darwin
            os: macos-13          # Intel runner
            binary: agent
            asset_name: agent-x86_64-apple-darwin

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: agent
            asset_name: agent-x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # librdkafka build dependencies (Linux only)
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev libcurl4-openssl-dev cmake make g++

      # librdkafka build dependencies (macOS)
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake openssl@3

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release -p agent --target ${{ matrix.target }}
        env:
          OPENSSL_DIR: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/openssl@3' || '' }}
          PKG_CONFIG_ALLOW_CROSS: "1"

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          name: "Hardware Watchdog ${{ github.ref_name }}"
          body: |
            ## Hardware Watchdog ${{ github.ref_name }}

            ### Download the agent for your platform

            | Platform | File |
            |---|---|
            | Mac (Apple Silicon M1/M2/M3/M4) | `agent-aarch64-apple-darwin` |
            | Mac (Intel) | `agent-x86_64-apple-darwin` |
            | Linux (x86_64) | `agent-x86_64-unknown-linux-gnu` |

            ### Run

            ```bash
            chmod +x agent-<your-platform>

            KAFKA_BROKERS=<broker-url> \
            KAFKA_TOPIC=hw.metrics \
            ./agent-<your-platform>
            ```

            ### Optional env vars

            | Variable | Default | Description |
            |---|---|---|
            | `METRICS_INTERVAL_SECS` | `5` | Collection interval in seconds |
            | `RUST_LOG` | `info` | Log verbosity |
          files: artifacts/*
          fail_on_unmatched_files: true
