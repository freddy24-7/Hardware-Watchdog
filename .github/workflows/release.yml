name: Release agent binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            asset_name: agent-aarch64-apple-darwin

          - target: x86_64-apple-darwin
            os: macos-13
            asset_name: agent-x86_64-apple-darwin

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: agent-x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libssl-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release -p agent --target ${{ matrix.target }}
        env:
          OPENSSL_DIR: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/openssl@3' || '' }}

      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/agent ${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: "Hardware Watchdog ${{ github.ref_name }}"
          body: |
            ## Hardware Watchdog ${{ github.ref_name }}

            ### One-line install (macOS)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/freddy24-7/Hardware-Watchdog/main/install.sh | bash
            ```

            ### Manual download

            | Platform | File |
            |---|---|
            | Mac (Apple Silicon M1/M2/M3/M4) | `agent-aarch64-apple-darwin` |
            | Mac (Intel) | `agent-x86_64-apple-darwin` |
            | Linux (x86_64) | `agent-x86_64-unknown-linux-gnu` |
          files: artifacts/*
          fail_on_unmatched_files: true
