apiVersion: 1

datasources:
  - name: Hardware Watchdog PostgreSQL
    type: postgres
    isDefault: true
    # Grafana 10 expands $VAR syntax in provisioning files at startup
    url: "$GF_DATABASE_HOST:$GF_DATABASE_PORT"
    database: "$POSTGRES_DB"
    user: "$POSTGRES_USER"
    secureJsonData:
      password: "$POSTGRES_PASSWORD"
    jsonData:
      sslmode: require
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: false
