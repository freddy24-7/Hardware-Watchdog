# Named volumes — data survives container restarts; explicit names aid `docker volume ls` inspection
volumes:
  postgres_data:
  kafka_data:
  zookeeper_data:
  grafana_data:

services:

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  # Required by Kafka for cluster coordination. KRaft mode (no Zookeeper) is
  # available in newer Confluent images but adds complexity; ZK is simpler for
  # a single-node dev setup.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "bash", "-c", "/usr/bin/nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners: internal (service-to-service) and external (host access for testing)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Auto-create topic on first produce; single partition is sufficient for one agent
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"  # expose EXTERNAL listener for kcat / console consumer on host
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchdog}
      POSTGRES_DB: ${POSTGRES_DB:-watchdog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run migrations automatically on first boot via initdb scripts
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchdog} -d ${POSTGRES_DB:-watchdog}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Metrics Agent ──────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hw.metrics}
      METRICS_INTERVAL_SECS: ${METRICS_INTERVAL_SECS:-5}
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      # Agent is healthy as long as the process is alive; no HTTP endpoint needed
      test: ["CMD-SHELL", "pgrep -x agent || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kafka Consumer / DB Writer ─────────────────────────────────────────────
  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hw.metrics}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-hw-watchdog}
      DATABASE_URL: ${DATABASE_URL:-postgres://watchdog:watchdog@postgres:5432/watchdog}
      CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-50}
      CONSUMER_BATCH_TIMEOUT_MS: ${CONSUMER_BATCH_TIMEOUT_MS:-2000}
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x consumer || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Pass Postgres connection details so datasource YAML can reference them
      GF_DATABASE_HOST: postgres
      GF_DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-watchdog}
      POSTGRES_USER: ${POSTGRES_USER:-watchdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchdog}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | tr -d ' ' | grep -q '\"database\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
