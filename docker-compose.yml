# Named volumes — data survives container restarts; explicit names aid `docker volume ls` inspection
volumes:
  postgres_data:
  grafana_data:

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchdog}
      POSTGRES_DB: ${POSTGRES_DB:-watchdog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchdog} -d ${POSTGRES_DB:-watchdog}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Ingest Service ─────────────────────────────────────────────────────────
  # Axum HTTP server: receives metric POSTs from agents and writes to Postgres.
  ingest:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://watchdog:watchdog@postgres:5432/watchdog}
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Metrics Agent ──────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      ingest:
        condition: service_healthy
    environment:
      INGEST_URL: ${INGEST_URL:-http://ingest:8080/ingest}
      METRICS_INTERVAL_SECS: ${METRICS_INTERVAL_SECS:-5}
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x agent || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_HOST: postgres
      GF_DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-watchdog}
      POSTGRES_USER: ${POSTGRES_USER:-watchdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchdog}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | tr -d ' ' | grep -q '\"database\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
